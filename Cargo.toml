[workspace]
members = ["crates/certs", "crates/core", "crates/expose", "crates/mesh", "crates/testkit", "src-tauri"]
resolver = "2"

# ============================================================================
# Shared dependencies — declared once here; members inherit with `foo.workspace = true`
# ============================================================================
[workspace.dependencies]
tokio = { version = "1.53", features = ["full"] }
tokio-util = "0.7.19"
# Home-directory lookup for tilde expansion in config paths (core) and the
# profile directory (expose)
dirs = "6"

# ============================================================================
# Lints — applied uniformly via [workspace.lints]; sub-crates inherit with `[lints] workspace = true`
# ============================================================================
# Design intent:
# - unsafe_code is absolutely forbidden (deny; test modules may opt out locally with `#[allow(unsafe_code)]`)
# - panic is absolutely forbidden (deny) — hub/agent are long-running daemons; a panic on a single connection must not take down the process
# - unwrap_used / expect_used start as warn
# - pedantic / nursery start as warn
[workspace.lints.rust]
unsafe_code = "deny"
# Personal project with no external consumers — docs on pub items are not enforced.
# Comments are still written where needed.
missing_docs = "allow"
rust_2024_compatibility = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# A few long functions live in the hub/agent handling paths (connect_and_register /
# handle_request, etc.); splitting them is not worth it — raise the threshold.
too_many_lines = "allow"
# Significant-drop scope tightening suggestions are mostly false positives on hub paths
# (routing + forwarding inherently hold locks), keep as allow.
significant_drop_tightening = "allow"
# In test scenarios, placing use statements inside loops/branches is more readable
# and has no impact on prod.
items_after_statements = "allow"
# Rewriting `if let Some {}` with Option::map_or_else is harder to read with multiple
# branches / early returns, keep as allow.
option_if_let_else = "allow"

# Safety-critical — effective immediately
panic = "deny"

# Holding a std/parking_lot lock guard across an await point is the deadlock
# shape behind the 2026-09-18 GUI Stop hang
# (docs/bug/2026-09-18-gui-stop-deadlock-start-holds-handle-lock.md) — deny it
# compile-time. tokio's async Mutex guards are NOT covered by this lint: an
# async lock is only acceptable where holding it across an await is the point,
# and must never be re-locked under a guard that survives the await.
await_holding_lock = "deny"

# Personal project: unwrap/expect are used heavily in infallible spots (Response::builder, etc.);
# upgrading to deny is more noise than benefit. Apply individual #[warn]/#[deny] locally when needed.
unwrap_used = "allow"
expect_used = "allow"

# Too noisy, keep as allow
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
default_trait_access = "allow"

# ============================================================================
# Profiles
# ============================================================================
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
debug = "line-tables-only"
incremental = false
# Keep panic = "unwind" (the default): a long-running daemon should not exit entirely
# because of a panic on a single connection; clippy::panic = "deny" keeps panics rare.

[profile.profiling]
inherits = "release"
debug = true
strip = "none"

[profile.dev]
debug = "limited"
