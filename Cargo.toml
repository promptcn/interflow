[workspace]
 members = ["crates/buildinfo", "crates/certs", "crates/cli", "crates/contract", "crates/core", "crates/expose", "crates/identity", "crates/mesh", "crates/registrar", "crates/renewal", "crates/testkit", "crates/util", "src-tauri"]
resolver = "2"
# Continuous-fuzzing crate for the hand-written wire codecs; carries its own
# lockfile and a nightly toolchain requirement, so it stays out of the workspace.
exclude = ["fuzz"]

[workspace.package]
version = "0.11.1"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"

# ============================================================================
# Shared dependencies — declared once here; members inherit with `foo.workspace = true`
# ============================================================================
[workspace.dependencies]
tokio = { version = "1.53", features = ["full"] }
tokio-util = "0.7.19"
serde = { version = "1.0", features = ["derive"] }
toml = "1"
# Format-preserving TOML editing (structured manifest appends keep the
# operator's comments and layout); the same crate `toml` 1.x builds on.
toml_edit = "0.25"
thiserror = "2"
sha2 = "0.11"
hex = "0.4"
# Home-directory lookup for tilde expansion in config paths (core) and the
# profile directory (expose)
dirs = "6"
# Cross-platform advisory file locks (flock / LockFileEx) — the audit
# ledger's single-writer guard across processes
fs2 = "0.4"
# Machine-owned state storage (issuer bookkeeping db, GUI prefs db). Bundled
# builds the bundled SQLite amalgamation via cc — the workspace's first C
# dependency, exercised through the zig (musl) / xwin (windows) cross paths.
rusqlite = { version = "0.40", features = ["bundled"] }
# Line diff for `plan diff` (declaration vs applied snapshot) — pure Rust.
similar = "3.2"

# Internal crates — path + version dual specs, declared once here so members
# inherit with `interflow-x.workspace = true`. Nothing is published to
# crates.io (the source export is the distribution); the version literal
# exists for cargo-deny's wildcard ban (a spec with no version requirement
# is a wildcard — the v0.11.0 export reddened public CI on all twelve) and
# is pinned to the workspace version by check_version_contract.py, so it
# cannot drift the way the v0.11.0 bump's 39 stale member-manifest pins did
# (fixed in c458728). scripts/bump_version.py moves it with every bump.
interflow-buildinfo = { path = "crates/buildinfo", version = "0.11.1" }
interflow-certs = { path = "crates/certs", version = "0.11.1" }
interflow-cli = { path = "crates/cli", version = "0.11.1" }
interflow-contract = { path = "crates/contract", version = "0.11.1" }
interflow-core = { path = "crates/core", version = "0.11.1" }
interflow-expose = { path = "crates/expose", version = "0.11.1" }
interflow-identity = { path = "crates/identity", version = "0.11.1" }
interflow-mesh = { path = "crates/mesh", version = "0.11.1" }
interflow-registrar = { path = "crates/registrar", version = "0.11.1" }
interflow-renewal = { path = "crates/renewal", version = "0.11.1" }
interflow-testkit = { path = "crates/testkit", version = "0.11.1" }
interflow-util = { path = "crates/util", version = "0.11.1" }

# ============================================================================
# Lints — applied uniformly via [workspace.lints]; sub-crates inherit with `[lints] workspace = true`
# ============================================================================
# Design intent:
# - unsafe_code is absolutely forbidden (deny; test modules may opt out locally with `#[allow(unsafe_code)]`)
# - panic is absolutely forbidden (deny) — hub/agent are long-running daemons; a panic on a single connection must not take down the process
# - unwrap_used / expect_used start as warn
# - pedantic / nursery start as warn
[workspace.lints.rust]
unsafe_code = "deny"
# Personal project with no external consumers — docs on pub items are not enforced.
# Comments are still written where needed.
missing_docs = "allow"
rust_2024_compatibility = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# A few long functions live in the hub/agent handling paths (connect_and_register /
# handle_request, etc.); splitting them is not worth it — raise the threshold.
too_many_lines = "allow"
# Significant-drop scope tightening suggestions are mostly false positives on hub paths
# (routing + forwarding inherently hold locks), keep as allow.
significant_drop_tightening = "allow"
# In test scenarios, placing use statements inside loops/branches is more readable
# and has no impact on prod.
items_after_statements = "allow"
# Rewriting `if let Some {}` with Option::map_or_else is harder to read with multiple
# branches / early returns, keep as allow.
option_if_let_else = "allow"

# Safety-critical — effective immediately
panic = "deny"

# Holding a std/parking_lot lock guard across an await point is the deadlock
# shape behind the 2026-09-18 GUI Stop hang
# — deny it
# compile-time. tokio's async Mutex guards are NOT covered by this lint: an
# async lock is only acceptable where holding it across an await is the point,
# and must never be re-locked under a guard that survives the await.
await_holding_lock = "deny"

# Personal project: unwrap/expect are used heavily in infallible spots (Response::builder, etc.);
# upgrading to deny is more noise than benefit. Apply individual #[warn]/#[deny] locally when needed.
unwrap_used = "allow"
expect_used = "allow"

# Too noisy, keep as allow
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
default_trait_access = "allow"

# ============================================================================
# Profiles
# ============================================================================
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
debug = "line-tables-only"
incremental = false
# Keep panic = "unwind" (the default): a long-running daemon should not exit entirely
# because of a panic on a single connection; clippy::panic = "deny" keeps panics rare.

[profile.profiling]
inherits = "release"
debug = true
strip = "none"

# No incremental compilation: with it on, every changed-code cargo invocation
# (rust-analyzer check-on-save, nextest/clippy loops) minted a fresh session
# dir under target/debug/incremental — 1025 sessions / 29GB in a single day of
# heavy work (2026-10-11), and nothing in the toolchain GCs them (cargo's
# auto-GC covers only ~/.cargo; cargo-sweep's --maxsize never touches
# incremental/). A profile is read by every entry point (RA, cargo aliases,
# tauri dev, raw cargo), unlike a justfile hook. For an interactive session
# that would benefit from incremental (e.g. tight cargo run loops on the gui
# crate), opt back in per invocation: CARGO_INCREMENTAL=1 cargo …
[profile.dev]
debug = "limited"
incremental = false

# Dependencies carry no DWARF (the bulk of test-binary size); workspace
# crates keep line-tables-only above, so backtraces still name dependency
# frames. To debug inside a dependency, use the opt-in profile instead of
# editing this section: cargo test/run --profile dep-debug.
[profile.dev.package."*"]
debug = false

# Opt-in: full debug info everywhere (dependency DWARF restored on top of
# the trimmed dev profile). Costs a separate artifact set only while used;
# nextest takes it via `--cargo-profile dep-debug`.
[profile.dep-debug]
inherits = "dev"
debug = true
[profile.dep-debug.package."*"]
debug = true
