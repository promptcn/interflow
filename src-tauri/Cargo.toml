[package]
name = "interflow-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Interflow expose GUI (Tauri 2.0)"
license.workspace = true
default-run = "interflow-gui"

[lib]
name = "interflow_gui"
path = "src/lib.rs"

[[bin]]
name = "interflow-gui"
path = "src/main.rs"

[[bin]]
name = "export-bindings"
path = "src/bin/export_bindings.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
interflow-core.workspace = true
interflow-cli.workspace = true
interflow-expose.workspace = true
interflow-identity.workspace = true
interflow-mesh.workspace = true
# Credential renewal scheduler (one per running node — GUI/binary parity)
interflow-renewal.workspace = true
# Atomic profile writes
interflow-util.workspace = true
# Compile-time build identity (machine header, tray tooltip, startup log)
interflow-buildinfo.workspace = true

tauri = { version = "2", features = ["tray-icon", "image-png", "specta"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
# One-time "still running in the tray" toast on first hide-to-tray
# (Windows); Rust-side only — no JS module registration, no ACL surface.
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
# Machine anchor: the GUI is machine-scoped, and the header/tray show which
# machine the nodes run on (a node is an identity, not a machine).
gethostname = "1.1"

# IPC contract codegen: TS types + typed invoke/event wrappers are generated
# from the Rust DTOs (src/bindings.ts) — the frontend never hand-writes them.
# specta and tauri-specta versions are exact-pinned in lockstep by upstream.
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }

tokio = { workspace = true }
# Cancellation tokens (ingress engine wrapper, renewal task abort)
tokio-util = { workspace = true }

tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.150"
toml = { workspace = true }
dirs = "6"
# Node ids (UUID v4, minted at add time; stable across credential rotations)
uuid = { version = "1.23", features = ["v4"] }
# GUI-owned prefs db (nodes profile + deploy recents + gui settings; one
# SQLite replaces the three per-domain TOML workaround files).
rusqlite = { workspace = true }

[dev-dependencies]
# In-process hub + self-signed certs for the Start/Stop round-trip regression
# tests (tunnel.rs) — the 2026-09-18 deadlock acceptance gate.
interflow-testkit.workspace = true
# Bindings-freshness drift guard test (contract.rs)
tempfile = "3"

[lints]
workspace = true
