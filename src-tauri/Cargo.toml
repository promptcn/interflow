[package]
name = "interflow-gui"
version = "0.2.1"
edition = "2024"
rust-version = "1.97"
description = "Interflow expose GUI (Tauri 2.0)"
license = "MIT"
default-run = "interflow-gui"

[lib]
name = "interflow_gui"
path = "src/lib.rs"

[[bin]]
name = "interflow-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
interflow-expose = { path = "../crates/expose", version = "0.2" }
interflow-mesh = { path = "../crates/mesh", version = "0.2" }

tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"

tokio = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }

tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.150"

[lints]
workspace = true
