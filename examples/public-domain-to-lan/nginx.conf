# Public TLS entry point for the generic example.
#
# Replace example.com with your registered domain and obtain a publicly
# trusted certificate before using this in production. nginx terminates TLS,
# adds the visitor IP to X-Forwarded-For, and forwards the request to edge.

limit_req_zone $binary_remote_addr zone=interflow_example_api:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=interflow_example_conn:10m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 443 ssl http2;
    server_name app.example.com;

    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.3;

    location / {
        limit_req zone=interflow_example_api burst=20 nodelay;
        limit_conn interflow_example_conn 20;

        proxy_pass http://127.0.0.1:8443;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}

server {
    listen 80;
    server_name app.example.com;
    return 301 https://$host$request_uri;
}
