# Public-edge route table.
#
# The edge selects a route by the HTTP Host header received from nginx. The
# tenant and agent_id form the tunnel target; remote_addr is dialed by the
# LAN expose agent.

[[routes]]
host = "app.example.com"
tenant = "demo"
agent_id = "lan-agent"
remote_addr = "127.0.0.1:3000"

