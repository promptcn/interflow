# Hub configuration for the site-to-site quickstart (v4, mTLS-only).
#
# The hub authenticates agents with tenant-issued client certificates, enforces
# agent identity binding, and routes streams. With both agents configured for
# required E2E, TCP payload is additionally encrypted agent-to-agent and remains
# ciphertext to this hub.

config_version = 4

[server]
listen_addr = "0.0.0.0:6666"

[auth]
rate_limit_per_minute = 30

[[auth.tenants]]
name = "demo"
ca_path = "certs/tenants/demo-ca.crt"

[tls]
enabled = true
cert_path = "certs/hub.crt"
key_path = "certs/hub.key"
min_version = "1.3"

[security]
channel_send_timeout_secs = 30
poll_grace_secs = 30

[heartbeat]
enabled = true
interval_secs = 15
max_missed = 4

[logging]
level = "info,interflow=debug"
format = "plain"

# Optional transport tuning. QUIC idle timeouts negotiate as the endpoints'
# minimum, so change both hub and agents together.
# [transport.h2]
# keepalive_interval_secs = 5
# keepalive_timeout_secs = 10
#
# [transport.quic]
# enabled = true
# listen_addr = "0.0.0.0:6667"
# datagram_enabled = true
