# Expose-side profile template (runs on the LAN machine)
#
# Copy to ~/.config/interflow/profile.toml (Linux) or
# ~/Library/Application Support/interflow/profile.toml (macOS).
#
# Afterwards `interflow-expose expose <port>` alone is enough — arguments
# come from the profile. On first use, `interflow-expose expose 8080 --save`
# writes this file (--save persists absolute paths, so it keeps working from
# any directory).
#
# Relative paths inside the profile resolve against the profile file's own
# directory (generate dev certificates into `certs/` next to it with
# `./scripts/gen_certs.sh examples/reverse-tunnel-public/certs` from the repo
# root; when installing the profile into ~/.config/interflow/, copy certs/
# along or switch to absolute paths).
#
# Schema: crates/expose/src/profile.rs (deny_unknown_fields)

hub_url = "https://example.com:16666"          # edge hub address on the public server
auth_token = "${INTERFLOW_EDGE_TOKEN}"          # same as the edge side's --token
agent_id = "desktop"                            # must match an agent_id in routes.toml
ca_path = "certs/ca.crt"                        # trusted hub CA (required when self-signed)
