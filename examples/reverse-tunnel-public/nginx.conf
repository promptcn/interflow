# Nginx configuration (public entry point) — production-ready
#
# Purpose: terminate public TLS (real Let's Encrypt certificates) and forward
# requests to the local interflow-expose edge. The edge listens on 127.0.0.1:8443
# (plain HTTP — nginx already terminated TLS).
#
# Deploy: place at /etc/nginx/sites-available/interflow.conf and symlink into
# sites-enabled/.

# Rate limiting: 10 requests/s per IP, burst 20
limit_req_zone $binary_remote_addr zone=interflow_api:10m rate=10r/s;
# Concurrency: at most 20 connections per IP
limit_conn_zone $binary_remote_addr zone=interflow_conn:10m;

# WebSocket upgrade mapping
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl http2;
    server_name asr.example.com tts.example.com;

    # Real Let's Encrypt certificates (publicly trusted)
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Optional: client mTLS (trust only your client CA). If you don't want
    # client authentication, add at least Basic Auth or an OAuth proxy —
    # never leave / completely open.
    # ssl_client_certificate /etc/interflow/certs/client-ca.crt;
    # ssl_verify_client on;

    # ASR service
    location / {
        limit_req zone=interflow_api burst=20 nodelay;
        limit_conn interflow_conn 20;

        proxy_pass http://127.0.0.1:8443;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade (if the service needs it)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Long-lived connection timeouts
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}

# 80 -> 443 redirect
server {
    listen 80;
    server_name asr.example.com tts.example.com;
    return 301 https://$host$request_uri;
}
