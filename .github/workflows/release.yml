name: release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build-matrix:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            archive: tar.gz
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-14
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-14
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            archive: zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install NASM (aws-lc-sys asm on msvc)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        run: |
          choco install nasm -y
          echo "C:/Program Files/NASM" >> $GITHUB_PATH
      - name: Install zig + cargo-zigbuild (Linux musl cross-link)
        if: matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          # zig is not in Ubuntu's apt repos; the ziglang PyPI wheel is the
          # cargo-zigbuild-documented CI install (ships a `zig` entry point).
          pip3 install ziglang
          cargo install --locked cargo-zigbuild
      - name: Build (Linux musl via zigbuild)
        if: matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-unknown-linux-musl'
        run: cargo zigbuild --release --target ${{ matrix.target }} --bin interflow-mesh --bin interflow-expose
      - name: Build (macOS / Windows)
        if: matrix.target != 'x86_64-unknown-linux-musl' && matrix.target != 'aarch64-unknown-linux-musl'
        run: cargo build --release --target ${{ matrix.target }} --bin interflow-mesh --bin interflow-expose
      - name: Stage artifacts (Unix)
        if: matrix.archive == 'tar.gz'
        run: |
          staging=interflow-${{ github.ref_name }}-${{ matrix.target }}
          mkdir -p $staging
          cp target/${{ matrix.target }}/release/interflow-mesh target/${{ matrix.target }}/release/interflow-expose $staging/
          cp README.md LICENSE* $staging/
          tar czf $staging.tar.gz $staging
          shasum -a 256 $staging.tar.gz > $staging.tar.gz.sha256
      - name: Stage artifacts (Windows)
        if: matrix.archive == 'zip'
        # Pure PowerShell: Git Bash carries neither `zip` nor `shasum`, so the
        # staging uses native Compress-Archive / Get-FileHash instead.
        shell: pwsh
        run: |
          $staging = "interflow-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force $staging | Out-Null
          Copy-Item target/${{ matrix.target }}/release/interflow-mesh.exe, target/${{ matrix.target }}/release/interflow-expose.exe, README.md, LICENSE $staging
          Compress-Archive $staging "$staging.zip"
          $hash = (Get-FileHash "$staging.zip" -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$PWD/$staging.zip.sha256", "$hash  $staging.zip`n")
      - name: Upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            interflow-*.tar.gz
            interflow-*.tar.gz.sha256
            interflow-*.zip
            interflow-*.zip.sha256
          fail_on_unmatched_files: false

  gui:
    name: gui ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: build-matrix
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            bundles: dmg
          - target: x86_64-apple-darwin
            os: macos-14
            bundles: dmg
          # GUI linux builds use gnu, not musl: webkit2gtk has no musl story
          # and desktop targets don't need static linking.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            bundles: appimage,deb
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            bundles: nsis,msi
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install NASM (aws-lc-sys asm, msvc)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install nasm -y
          echo "C:/Program Files/NASM" >> $GITHUB_PATH
      - name: Install GUI system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      # tauri build runs the vite build itself (beforeBuildCommand) and passes
      # --target through to cargo; bundles land in
      # target/<triple>/release/bundle/.
      - name: Build GUI bundle (tauri)
        shell: bash
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      # Sidecars carry the bare filename so `shasum -c` works next to a
      # downloaded asset, with LF endings so GNU sha256sum accepts them. Git
      # Bash's shasum produced empty files (upload rejected: size >= 1), hence
      # the platform split.
      - name: Checksums (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd "target/${{ matrix.target }}/release/bundle"
          find . -type f \( -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.exe' -o -name '*.msi' \) | while IFS= read -r f; do
            shasum -a 256 "$f" | sed 's|  \./[^ ]*/|  |' > "$f.sha256"
          done
      - name: Checksums (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem "target/${{ matrix.target }}/release/bundle" -Recurse -File -Include *.dmg,*.AppImage,*.deb,*.exe,*.msi | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            [IO.File]::WriteAllText("$($_.FullName).sha256", "$hash  $($_.Name)`n")
          }
      - name: Upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg.sha256
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage.sha256
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/deb/*.deb.sha256
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/nsis/*.exe.sha256
            target/${{ matrix.target }}/release/bundle/msi/*.msi
            target/${{ matrix.target }}/release/bundle/msi/*.msi.sha256
          fail_on_unmatched_files: false

  docker:
    name: build and publish docker image
    runs-on: ubuntu-24.04
    needs: build-matrix
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
