name: release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build-matrix:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            archive: tar.gz
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-14
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-14
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            archive: zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install zig (Linux musl cross-link)
        if: matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y zig
          cargo install --locked cargo-zigbuild
      - name: Build (Linux musl via zigbuild)
        if: matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-unknown-linux-musl'
        run: cargo zigbuild --release --target ${{ matrix.target }}
      - name: Build (macOS / Windows)
        if: matrix.target != 'x86_64-unknown-linux-musl' && matrix.target != 'aarch64-unknown-linux-musl'
        run: cargo build --release --target ${{ matrix.target }}
      - name: Stage artifacts (Unix)
        if: matrix.archive == 'tar.gz'
        run: |
          staging=interflow-${{ github.ref_name }}-${{ matrix.target }}
          mkdir -p $staging
          cp target/${{ matrix.target }}/release/interflow-mesh target/${{ matrix.target }}/release/interflow-expose $staging/
          cp README.md LICENSE* $staging/
          tar czf $staging.tar.gz $staging
          sha256sum $staging.tar.gz > $staging.tar.gz.sha256
      - name: Stage artifacts (Windows)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          staging=interflow-${{ github.ref_name }}-${{ matrix.target }}
          mkdir -p $staging
          cp target/${{ matrix.target }}/release/interflow-mesh.exe target/${{ matrix.target }}/release/interflow-expose.exe $staging/
          cp README.md LICENSE* $staging/
          (cd $staging && zip -r ../$staging.zip .)
          sha256sum $staging.zip > $staging.zip.sha256
      - name: Upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            interflow-*.tar.gz
            interflow-*.tar.gz.sha256
            interflow-*.zip
            interflow-*.zip.sha256
          fail_on_unmatched_files: false

  docker:
    name: build and publish docker image
    runs-on: ubuntu-24.04
    needs: build-matrix
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
