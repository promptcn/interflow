name: audit

on:
  schedule:
    - cron: "17 6 * * 1,4"
  push:
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - ".github/workflows/audit.yml"
  pull_request:
    paths:
      - "Cargo.lock"

jobs:
  cargo-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
