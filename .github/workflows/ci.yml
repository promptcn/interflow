name: ci

on:
  push:
    branches: [main, develop, master]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  product-language:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: design generation labels must not leak into product language
        run: python3 scripts/check_product_language.py

  version-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: enforce version and rotation model
        run: python3 scripts/check_version_contract.py

  machete:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - name: unused dependencies
        run: cargo machete

  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: rustfmt check
        run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # interflow-gui (Tauri) is excluded here and covered by the `gui` job
      # below: its webkit2gtk/Node toolchain is heavy and failure isolation is
      # clearer as a separate job.
      - name: clippy
        run: cargo clippy --workspace --exclude interflow-gui --all-targets --all-features

  test:
    runs-on: ubuntu-24.04
    services:
      pebble:
        image: ghcr.io/letsencrypt/pebble:latest
        ports:
          - 14000:14000
        env:
          PEBBLE_VA_NOSLEEP: "1"
          PEBBLE_VA_ALWAYS_VALID: "1"
          PEBBLE_WFE_NONCEREJECT: "0"
    env:
      # Preset pebble directory signals "reuse the service container" to
      # the stage script, which extracts the trust anchor itself.
      INTERFLOW_PEBBLE: https://127.0.0.1:14000/dir
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # The five test stages (lib / bins / doc / mesh e2e / rest e2e) and
      # the pebble environment contract live in ONE script — the same one
      # scripts/export_public.sh runs against the exported tree before
      # committing (public-CI parity), so the workflow and the export can
      # never drift apart. Stages tee full output to a log and, on failure,
      # surface ::error:: annotations: anonymous API readers cannot download
      # run logs, but annotations ARE public — this is the failure-visibility
      # channel for outside collaborators. Stages 1/2/4/5 run under
      # cargo-nextest (per-test process isolation + cross-binary parallelism;
      # installed above), doc tests on libtest. Integration tests run in
      # parallel: every listener binds `:0` and reads its actual address
      # from readiness signals (hub/agent handles, EdgeReady); stages split
      # per crate so a failure names the crate.
      - name: test stages
        run: bash scripts/ci_test_stages.sh

  gui:
    name: gui (tauri)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Tauri 2 system dependencies (linux webview stack)
      - name: Install GUI system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # dist/ must exist before cargo compiles src-tauri: generate_context!
      # embeds the frontend assets at compile time.
      - name: Frontend typecheck and build
        run: |
          npm ci
          npm run typecheck
          npm run build
      - name: clippy (gui)
        run: cargo clippy -p interflow-gui --all-targets --all-features
      - name: cargo nextest (gui)
        run: cargo nextest run -p interflow-gui --all-features

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
