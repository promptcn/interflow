name: ci

on:
  push:
    branches: [main, develop, master]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  product-language:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: design generation labels must not leak into product language
        run: python3 scripts/check_product_language.py

  version-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: enforce version and rotation model
        run: python3 scripts/check_version_contract.py

  machete:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - name: unused dependencies
        run: cargo machete

  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: rustfmt check
        run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # interflow-gui (Tauri) is excluded here and covered by the `gui` job
      # below: its webkit2gtk/Node toolchain is heavy and failure isolation is
      # clearer as a separate job.
      - name: clippy
        run: cargo clippy --workspace --exclude interflow-gui --all-targets --all-features

  test:
    runs-on: ubuntu-24.04
    services:
      pebble:
        image: ghcr.io/letsencrypt/pebble:latest
        ports:
          - 14000:14000
        env:
          PEBBLE_VA_NOSLEEP: "1"
          PEBBLE_VA_ALWAYS_VALID: "1"
          PEBBLE_WFE_NONCEREJECT: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install pebble directory trust anchor
        run: |
          docker cp $(docker ps -qf ancestor=ghcr.io/letsencrypt/pebble):/test/certs/pebble.minica.pem /tmp/pebble.minica.pem
          # The rustls client in the ACME runtime reads an explicit CA file;
          # exporting SSL_CERT_FILE additionally covers any system-root path.
      - name: unit tests (lib/bins/doc)
        run: cargo test --workspace --exclude interflow-gui --all-features --no-fail-fast --lib --bins --doc
        env:
          INTERFLOW_PEBBLE: https://127.0.0.1:14000/dir
          INTERFLOW_PEBBLE_CA: /tmp/pebble.minica.pem
      # Integration tests run serially (--test-threads=1, matching `just
      # test-e2e`): they share the ephemeral-port pool and parallel picks
      # race the hub binds. Split per crate so a failure names the crate.
      - name: e2e tests (mesh, serial)
        run: cargo test -p interflow-mesh --all-features --no-fail-fast --test '*' -- --test-threads=1
        env:
          INTERFLOW_PEBBLE: https://127.0.0.1:14000/dir
          INTERFLOW_PEBBLE_CA: /tmp/pebble.minica.pem
      - name: e2e tests (rest, serial)
        run: cargo test --workspace --exclude interflow-gui --exclude interflow-mesh --all-features --no-fail-fast --test '*' -- --test-threads=1
        env:
          INTERFLOW_PEBBLE: https://127.0.0.1:14000/dir
          INTERFLOW_PEBBLE_CA: /tmp/pebble.minica.pem

  gui:
    name: gui (tauri)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Tauri 2 system dependencies (linux webview stack)
      - name: Install GUI system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # dist/ must exist before cargo compiles src-tauri: generate_context!
      # embeds the frontend assets at compile time.
      - name: Frontend typecheck and build
        run: |
          npm ci
          npm run typecheck
          npm run build
      - name: clippy (gui)
        run: cargo clippy -p interflow-gui --all-targets --all-features
      - name: cargo test (gui)
        run: cargo test -p interflow-gui --all-features --no-fail-fast

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
