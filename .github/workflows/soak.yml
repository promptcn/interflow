name: soak

# Nightly soak long-run guardrail (backlog §1.7): real process topology + six assertions.
# Local equivalent: `just soak`; smoke test: workflow_dispatch defaults or `just soak -- --quick`.
on:
  schedule:
    - cron: "43 19 * * *" # daily 19:43 UTC (03:43 Beijing time; avoids the audit slot at 06:17)
  workflow_dispatch:

concurrency:
  group: soak
  cancel-in-progress: true

jobs:
  soak:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build mesh (release)
        run: cargo build --release -p interflow-mesh
      - name: Run soak (15min/transport × h2+quic)
        run: |
          set -o pipefail
          cargo run --release -p interflow-testkit --bin soak -- \
            --duration-secs 900 \
            --out bench-results/soak-ci/results.json 2>&1 | tee soak.log
      - name: Upload artifacts (always uploaded — failures must leave evidence behind)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-results
          path: |
            bench-results/soak-ci/
            soak.log
          if-no-files-found: warn
