name: soak

# Nightly soak long-run guardrail (backlog §1.7): real process topology + assertion suite.
# Local equivalent: `just soak`; smoke test: workflow_dispatch defaults or `just soak -- --quick`.
# Node logs in the uploaded artifact are gzipped in place after the run (*.log.gz).
on:
  schedule:
    - cron: "43 19 * * *" # daily 19:43 UTC (03:43 Beijing time; avoids the audit slot at 06:17)
  workflow_dispatch:

concurrency:
  group: soak
  cancel-in-progress: true

jobs:
  soak:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The system under test is the `interflow-soak-node` dev binary (hub +
      # agents), which `cargo run --bin soak` does not build on its own — the
      # same build line `just soak` runs. (Until 2026-11-02 this step built
      # `interflow-mesh`, the pre-2026-09-22 binary name: the runner then
      # failed at startup with "interflow-soak-node binary not found".)
      - name: Build the soak node (release)
        run: cargo build --release -p interflow-testkit --features fault-injection --bin interflow-soak-node
      - name: Run soak (15min/transport × h2+quic; identity-churn phase after warmup)
        run: |
          set -o pipefail
          cargo run --release -p interflow-testkit --bin soak -- \
            --duration-secs 900 \
            --out bench-results/soak-ci/results.json 2>&1 | tee soak.log
      - name: Upload artifacts (always uploaded — failures must leave evidence behind)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-results
          path: |
            bench-results/soak-ci/
            soak.log
          if-no-files-found: warn
