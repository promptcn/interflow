[graph]
all-features = true

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# Advisories with no upstream fix (unmaintained, or upstream has not shipped a
# replacement yet): each entry includes its rationale; re-evaluate after the next
# transitive-dependency upgrades.
ignore = [
    # The gtk-rs GTK3 bindings are unmaintained — only pulled in transitively by
    # tauri on the linux desktop build path; macOS / Windows / server-side mesh
    # scenarios never touch them; remove once tauri upstream switches to the GTK4
    # bindings.
    "RUSTSEC-2024-0370",
    # paste: unmaintained upstream with no safe replacement; it is a transitive
    # macro dependency of the Tauri/Specta GUI build and is not present in the
    # mesh/expose runtime graph. Re-evaluate when specta/tauri migrate off it.
    "RUSTSEC-2024-0436",
    # unic-* family: pulled in via tauri → urlpattern → unic-ucd-ident; the
    # open-source replacements (icu_properties / unicode-ident) are still being
    # migrated to.
    "RUSTSEC-2025-0075",
    "RUSTSEC-2025-0080",
    "RUSTSEC-2025-0081",
    "RUSTSEC-2025-0098",
    "RUSTSEC-2025-0100",
    # rustls-pemfile: upstream was archived (2025-08), but this repo only uses its
    # PEM parsing, which is stable; the replacement (migrating to `pem` or writing
    # our own parser) is tracked as a separate task.
    "RUSTSEC-2025-0134",
    # zbus-5 family (zvariant / zbus_names / zvariant_derive): folded into
    # zbus 6 and unmaintained as standalone crates. Pulled in ONLY via
    # interflow-gui -> tauri-plugin-notification / single-instance ->
    # notify-rust 4.18.x, which still rides zbus 5 (verified: its 4.18.2
    # update does not migrate); they never reach the mesh / expose /
    # identity runtime graph. Unmaintained-class, not vulnerabilities.
    # Re-evaluate when tauri's notification plugins move to zbus 6.
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0371",
    "RUSTSEC-2026-0372",
    # basic-toml: upstream archived 2025-03, no fix will ever exist
    # (unmaintained-class; the advisory lists only alternatives). Sole path:
    # interflow-identity → age → i18n-embed-fl → i18n-embed-impl
    # (fluent-system) → i18n-config 0.4.8 — whose latest release still
    # requires basic-toml. It only parses i18n.toml at compile time during
    # age's macro expansion and is never linked into a runtime binary.
    # (The age 0.12 refresh of this chain already retired the
    # proc-macro-error2 exemption below the same age dependency.) Remove
    # when i18n-config migrates to the `toml` crate or age drops its fluent
    # localization.
    "RUSTSEC-2026-0374",
    # crypto-bigint 0.5.5 (timing side channels in "constant-time" ops):
    # the fix (0.7.6) sits on the semver-incompatible 0.7 line — reachable
    # only through elliptic-curve 0.13 / p256 0.14+, and age 0.12.1 pins
    # p256 ^0.13 unconditionally (no feature drops it; verified against its
    # manifest). Sole path: interflow-identity → age → p256 (tag/tagpq
    # recipients) → elliptic-curve → crypto-bigint. The affected code is
    # UNREACHABLE in every shipped binary: this product's sealing only ever
    # constructs x25519 and scrypt recipients — the p256-backed
    # `age1tag1…`/`age1tagpq1…` recipient types are never parsed, and age's
    # SSH layer rejects ecdsa keys outright. Ecosystem-wide bridged for the
    # same reason (the 0.13 elliptic-curve family strands every consumer
    # until upstreams republish). Remove when age requires p256 ≥ 0.14 —
    # the lock then resolves crypto-bigint ≥ 0.7.6 on its own.
    "RUSTSEC-2026-0387",
]

[licenses]
version = 2
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "0BSD",
    "Unlicense",
    # MPL-2.0: cssparser / selectors / dom_query / option-ext (dirs-sys) pulled in
    # transitively via tauri. The Mozilla Public License 2.0 is a weak copyleft
    # recognized by OSI/FSF; its file-level copyleft does not extend to statically
    # linked artifacts.
    "MPL-2.0",
    # CDLA-Permissive-2.0: used by webpki-root-certs (transitive via
    # rustls-platform-verifier) to license its root certificate dataset; it is a
    # data license, not a code license, and imposes no constraints on binary
    # distribution.
    "CDLA-Permissive-2.0",
    # BSL-1.0 (Boost Software License): clipboard-win / error-code, transitively
    # via tauri-plugin-clipboard-manager -> arboard. Permissive and OSI/FSF
    # approved; imposes only attribution/retention of the license text.
    "BSL-1.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    { name = "openssl" },
    { name = "openssl-sys" },
]
skip = [
    { name = "windows-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
