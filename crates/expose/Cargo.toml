[package]
name = "interflow-expose"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Ngrok-style tunnel: public hostname → local service"
license.workspace = true

[lib]
name = "interflow_expose"
path = "src/lib.rs"

[dependencies]
interflow-core.workspace = true
interflow-mesh.workspace = true
interflow-renewal.workspace = true
# Shared endpoint/authority parsing (hub QUIC addr derivation, Host routing)
interflow-util.workspace = true
# Compile-time build identity (engine startup log line)
interflow-buildinfo.workspace = true

# Async runtime
tokio = { workspace = true }
# Cancellation tokens (edge run_until graceful stop, ACME runtime shutdown)
tokio-util = { workspace = true }
futures = "0.3"


# TLS (issuance itself lives in interflow-certs)
tokio-rustls = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }

# Config / serialization
serde_json = { workspace = true }

# Logging
tracing = { workspace = true }


# Utilities
bytes = "1.12"
uuid = { workspace = true, features = ["v4"] }

# CLI

# Metrics
metrics = "0.24.6"

rustls-acme = { version = "0.15.4", features = ["tokio"] }

# Raise the fd soft limit (unix only)
[target.'cfg(unix)'.dependencies]
rlimit = "0.10"

[lints]
workspace = true

[dev-dependencies]
interflow-certs.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tempfile = { workspace = true }
criterion = { workspace = true }
# Shared test harness (certs for the QUIC e2e stack; fault-injection for the
# self-healing tests; production graph unaffected)
interflow-testkit = { workspace = true, features = ["fault-injection"] }
# e2e assertions on metrics counters (in-process recorder installed for direct snapshot reads)
metrics-exporter-prometheus = { version = "0.18", default-features = false }

[[bench]]
name = "expose_rps"
harness = false
path = "benches/expose_rps.rs"
