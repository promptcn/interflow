[package]
name = "interflow-expose"
version = "0.1.1"
edition = "2024"
rust-version = "1.97"
description = "Ngrok-style tunnel: public hostname → local service"
license = "MIT"

[lib]
name = "interflow_expose"
path = "src/lib.rs"

[[bin]]
name = "interflow-expose"
path = "src/main.rs"

[dependencies]
interflow-core = { path = "../core", version = "0.1" }
interflow-mesh = { path = "../mesh", version = "0.1" }

# Async runtime
tokio = { version = "1.52", features = ["full"] }

# HTTP/1 listener (for the edge)
hyper = { version = "1.10", features = ["full", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
http = "1.4"
http-body-util = "0.1.3"

# TLS / certificate generation
tokio-rustls = "0.26.4"
rustls = "0.23"
rustls-pemfile = "2.2.0"
rcgen = "0.14"
sha2 = "0.11"

# Config / serialization
serde = { version = "1.0", features = ["derive"] }
toml = "1"

# Logging
tracing = "0.1.44"

# Error handling
thiserror = "2"

# Utilities
bytes = "1.12"
uuid = { version = "1.23", features = ["v4"] }
dirs = "6"
rand = "0.10"
hex = "0.4"

# CLI
clap = { version = "4.6", features = ["derive"] }

# Metrics
metrics = "0.24.6"

# Hot reload: atomic route-table replacement + graceful task utilities
arc-swap = "1"
tokio-util = "0.7.19"

# Raise the fd soft limit (unix only)
[target.'cfg(unix)'.dependencies]
rlimit = "0.10"

[build-dependencies]
chrono = "0.4"

[lints]
workspace = true

[dev-dependencies]
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
x509-parser = "0.18"
tempfile = "3"
criterion = { version = "0.8", default-features = false, features = ["async_tokio"] }

[[bench]]
name = "expose_rps"
harness = false
path = "benches/expose_rps.rs"
