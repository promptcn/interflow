[package]
name = "interflow-expose"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Ngrok-style tunnel: public hostname → local service"
license.workspace = true

[lib]
name = "interflow_expose"
path = "src/lib.rs"

[dependencies]
interflow-core = { path = "../core", version = "0.4" }
interflow-mesh = { path = "../mesh", version = "0.4" }
# Shared endpoint/authority parsing (hub QUIC addr derivation, Host routing)
interflow-util = { path = "../util", version = "0.4" }

# Async runtime
tokio = { workspace = true }
# Cancellation tokens (edge run_until graceful stop, ACME runtime shutdown)
tokio-util = { workspace = true }
futures = "0.3"


# TLS (issuance itself lives in interflow-certs)
tokio-rustls = "0.26.4"
rustls = "0.23"
rustls-pemfile = "2.2.0"

# Config / serialization
serde_json = "1"

# Logging
tracing = "0.1.44"


# Utilities
bytes = "1.12"
uuid = { version = "1.23", features = ["v4"] }

# CLI

# Metrics
metrics = "0.24.6"

rustls-acme = { version = "0.15.4", features = ["tokio"] }

# Raise the fd soft limit (unix only)
[target.'cfg(unix)'.dependencies]
rlimit = "0.10"

[build-dependencies]
chrono = "0.4"

[lints]
workspace = true

[dev-dependencies]
interflow-certs = { path = "../certs", version = "0.4" }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tempfile = "3"
criterion = { version = "0.8", default-features = false, features = ["async_tokio"] }
# Shared test harness (certs for the QUIC e2e stack; fault-injection for the
# self-healing tests; production graph unaffected)
interflow-testkit = { path = "../testkit", version = "0.4", features = ["fault-injection"] }
# e2e assertions on metrics counters (in-process recorder installed for direct snapshot reads)
metrics-exporter-prometheus = { version = "0.18", default-features = false }

[[bench]]
name = "expose_rps"
harness = false
path = "benches/expose_rps.rs"
