# Generated by interflow plan apply — single public port: 443 SNI dispatch.
#
# Add once at the TOP LEVEL of nginx.conf (outside http {}):
#   stream { include /etc/nginx/interflow/stream/*.conf; }
#
# Business TLS terminates on the internal listener; control and
# registrar server names pass through so their mTLS stays end-to-end.
# Point [realm].control_endpoint at `<host>:443` and [registrar].endpoint
# at `https://<host>`, then close 16666/18666 in the firewall — the
# public surface is just 443.
#
# proxy_protocol on emits a v1 preamble (nginx >= 1.9.2; v2 needs the
# 1.31+ `v2` parameter — distro nginx stays the baseline) on every map
# target, restoring the real client IP after 127.0.0.1-fronted
# connections collapsed per-IP limits into one shared bucket. Three
# consumers, all tolerant of both versions and of headerless
# connections: the internal https listener (its `listen ... proxy_protocol`
# parameter, nginx >= 1.13.11, see nginx/http/interflow-shared.conf),
# the ingress control endpoint and the registrar (both consume the
# preamble before their TLS handshake).
map $ssl_preread_server_name $interflow_backend {
    hostnames;
    default                 127.0.0.1:9443;   # business → internal TLS termination
    example.com  127.0.0.1:16666;   # control endpoint (mTLS passthrough)
}

server {
    listen 443;
    ssl_preread on;
    proxy_protocol on;
    proxy_pass $interflow_backend;
    proxy_connect_timeout 5s;
}
