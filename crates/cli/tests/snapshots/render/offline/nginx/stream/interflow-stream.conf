# Generated by interflow plan apply — single public port: 443 SNI dispatch.
#
# Add once at the TOP LEVEL of nginx.conf (outside http {}):
#   stream { include /etc/nginx/interflow/stream/*.conf; }
#
# Business TLS terminates on the internal listener; the entries below
# pass through untouched, so their mTLS stays end-to-end. Point
# [realm].control_endpoint at `<host>:443` and [registrar].endpoint at
# `https://<host>`, then close 16666/18666 in the firewall — the public
# surface is just 443.
map $ssl_preread_server_name $interflow_backend {
    hostnames;
    default                 127.0.0.1:9443;   # business → internal TLS termination
    example.com  127.0.0.1:16666;   # control endpoint (mTLS passthrough)
}

server {
    listen 443;
    ssl_preread on;
    proxy_pass $interflow_backend;
    proxy_connect_timeout 5s;
}
