# Generated by interflow plan apply — port 80: ACME challenges + redirect.
server {
    listen 80;
    server_name asr.example.com;

    # Let's Encrypt HTTP-01 challenges (certbot --webroot -w /var/www/certbot);
    # drop this block if you renew certificates another way.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
