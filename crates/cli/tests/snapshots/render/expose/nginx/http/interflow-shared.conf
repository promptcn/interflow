# Generated by interflow plan apply — shared frontend-proxy primitives.
# Include from the http context together with the vhost fragments:
#   include /etc/nginx/interflow/http/*.conf;

# Rate limiting: 10 requests/s per client IP, burst 20.
limit_req_zone $binary_remote_addr zone=interflow_req:10m rate=10r/s;
# Concurrency: at most 20 connections per client IP.
limit_conn_zone $binary_remote_addr zone=interflow_conn:10m;

# WebSocket upgrade mapping.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
