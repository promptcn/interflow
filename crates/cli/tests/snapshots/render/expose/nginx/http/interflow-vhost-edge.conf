# Generated by interflow plan apply — frontend-proxy vhosts for ingress edge.
# The public 443 arrives via nginx/stream/interflow-stream.conf SNI dispatch;
# TLS terminates here on the internal listener. The ingress enables
# X-Forwarded-For restoration automatically in this topology.

server {
    listen 127.0.0.1:9443 ssl http2 proxy_protocol;
    server_name asr.example.com;

    # Fill in your public certificate (e.g. certbot's
    # /etc/letsencrypt/live/<domain>/fullchain.pem).
    ssl_certificate     /etc/nginx/certs/asr.example.com.crt;
    ssl_certificate_key /etc/nginx/certs/asr.example.com.key;
    ssl_protocols TLSv1.3;

    location / {
        limit_req zone=interflow_req burst=60 nodelay;
        limit_conn interflow_conn 50;

        proxy_pass http://127.0.0.1:8443;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Token streaming (SSE) must not be buffered by the proxy.
        proxy_buffering off;

        # WebSocket upgrade.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Throttle denials carry Retry-After so well-behaved
    # clients back off cleanly (same contract as the edge's
    # own 429s).
    error_page 429 = @interflow_rate_limited;
    location @interflow_rate_limited {
        add_header Retry-After 1 always;
        return 429;
    }
}

