[package]
name = "interflow-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The unified identity-first `interflow-cli` CLI: setup, plan, packs, doctor, identity lifecycle"
license.workspace = true

[[bin]]
name = "interflow-cli"
path = "src/main.rs"

[lib]
name = "interflow_cli"
path = "src/lib.rs"

[dependencies]
interflow-identity.workspace = true
interflow-core.workspace = true
interflow-mesh.workspace = true
interflow-expose.workspace = true
# sd_notify readiness (run_agent fires READY for Type=notify units)
interflow-util.workspace = true
# Shared renewal scheduler (pack lifecycle beside the engine)
interflow-renewal.workspace = true
# `--version` build tag — same const as `interflow-mesh version`
interflow-buildinfo.workspace = true

tokio = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
clap = { version = "4.6", features = ["derive"] }
toml = { workspace = true }
toml_edit = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
time = { version = "0.3", features = ["formatting", "parsing"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rustls = { version = "0.23", features = ["aws-lc-rs"] }
similar = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
interflow-registrar.workspace = true
interflow-renewal.workspace = true
# Test-process tracing sink (agent watcher / registrar serve under --nocapture)
interflow-testkit.workspace = true
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls-no-provider"] }
# In-process hub hosting for the apply e2e (policy_apply_hub_reinstall.rs)
tokio-util = { workspace = true }
