[package]
name = "interflow-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The unified identity-first `interflow-cli` CLI: setup, plan, packs, doctor, identity lifecycle"
license.workspace = true

[[bin]]
name = "interflow-cli"
path = "src/main.rs"

[lib]
name = "interflow_cli"
path = "src/lib.rs"

[dependencies]
interflow-identity.workspace = true
interflow-core.workspace = true
interflow-mesh.workspace = true
interflow-expose.workspace = true
# Public certificate material reading for doctor's cert face (SAN sets,
# validity windows, cert/key pairing over every PEM form).
interflow-certs.workspace = true
# sd_notify readiness (run_agent fires READY for Type=notify units)
interflow-util.workspace = true
# Shared renewal scheduler (pack lifecycle beside the engine)
interflow-renewal.workspace = true
# `--version` build tag — same const as `interflow-mesh version`
interflow-buildinfo.workspace = true

tokio = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = { workspace = true }
clap = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
time = { workspace = true, features = ["formatting", "parsing"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
rustls = { workspace = true, features = ["aws-lc-rs"] }
similar = { workspace = true }
tar = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
tempfile = { workspace = true }
interflow-registrar.workspace = true
interflow-renewal.workspace = true
# Doctor's certificate-material matrix issues boundary-dated fixtures.
rcgen = { workspace = true }
# Test-process tracing sink (agent watcher / registrar serve under --nocapture)
interflow-testkit.workspace = true
reqwest = { workspace = true }
# In-process hub hosting for the apply e2e (policy_apply_hub_reinstall.rs)
tokio-util = { workspace = true }
