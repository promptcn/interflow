[package]
name = "interflow-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The unified identity-first `interflow` CLI: setup, plan, packs, doctor, identity lifecycle"
license.workspace = true

[[bin]]
name = "interflow"
path = "src/main.rs"

[lib]
name = "interflow_cli"
path = "src/lib.rs"

[dependencies]
interflow-identity = { path = "../identity", version = "0.5" }
interflow-core = { path = "../core", version = "0.5" }
interflow-mesh = { path = "../mesh", version = "0.5" }
interflow-expose = { path = "../expose", version = "0.5" }
# sd_notify readiness (run_agent fires READY for Type=notify units)
interflow-util = { path = "../util", version = "0.5" }
# Shared renewal scheduler (pack lifecycle beside the engine)
interflow-renewal = { path = "../renewal", version = "0.5" }
# `--version` build tag — same const as `interflow-mesh version`
interflow-buildinfo = { path = "../buildinfo", version = "0.5" }

tokio = { workspace = true }
serde_json = "1"
clap = { version = "4.6", features = ["derive"] }
toml = { workspace = true }
toml_edit = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
time = { version = "0.3", features = ["formatting", "parsing"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rustls = { version = "0.23", features = ["aws-lc-rs"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
interflow-registrar = { path = "../registrar", version = "0.5" }
interflow-renewal = { path = "../renewal", version = "0.5" }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls-no-provider"] }
