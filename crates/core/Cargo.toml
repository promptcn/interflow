[package]
name = "interflow-core"
version = "0.1.2"
edition = "2024"
rust-version = "1.97"
description = "HTTP/2 tunnel primitives shared by interflow-expose and interflow-mesh"
license = "MIT"

[lib]
name = "interflow_core"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
# Async runtime
tokio = { workspace = true }

# HTTP/2
hyper = { version = "1.10", features = ["full", "http2"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
http = "1.4"
http-body-util = "0.1.3"

# Async utilities
futures = "0.3"
async-trait = "0.1"

# Config / serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.150"
toml = "1"

# Error handling
thiserror = "2"

# Byte buffers (frame codec)
bytes = "1.12"

# Logging / metrics
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = ["http-listener"] }

# QUIC transport (rustls provider matches the rustls above: aws-lc-rs)
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs", "log"] }

# TLS (rustls-only, openssl forbidden)
rustls = "0.23"
rustls-pemfile = "2.2.0"
tokio-rustls = "0.26.4"
rustls-pki-types = "1.15"
rustls-native-certs = "0.8.4"

# mTLS: extract the CN from client certificates for agent identity binding
x509-parser = "0.18"

# Cert pinning: SHA256 fingerprint verification + hex encode/decode
sha2 = "0.11"
hex = "0.4"

# Security: per-IP token-bucket rate limiting
governor = "0.10.4"
tokio-util = { workspace = true }

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["async_tokio"] }
# Paused clock (start_paused) for unit tests to deterministically verify the INCOMING_SEND_TIMEOUT path
tokio = { workspace = true, features = ["test-util"] }

# ============================================================================
# Benchmarks (criterion)
# ============================================================================
[[bench]]
name = "frame_codec"
harness = false
path = "benches/frame_codec.rs"
