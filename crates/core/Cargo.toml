[package]
name = "interflow-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "HTTP/2 tunnel primitives shared by the ingress engine and interflow-mesh"
license.workspace = true

[lib]
name = "interflow_core"
path = "src/lib.rs"

[features]
# Deterministic fault injection for the self-healing tests/soak (see
# src/fault.rs). Off by default: production builds compile every call point
# to a no-op and cannot install a hook.
fault-injection = []

[lints]
workspace = true

[dependencies]
interflow-contract = { path = "../contract", version = "0.5" }

# Async runtime
tokio = { workspace = true }

# HTTP/2
hyper = { version = "1.10", features = ["full", "http2"] }
http = "1.4"
http-body-util = "0.1.3"

# Async utilities
futures = "0.3"
async-trait = "0.1"

# Config / serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.150"
toml = "1"
# Home-directory lookup for tilde expansion (config path normalization)
dirs = { workspace = true }

# Error handling
thiserror = "2"

# Audit-chain timestamps (ISO 8601 UTC, second precision); also used by the
# inner-TLS verifier tests to construct explicit validity windows
time = { version = "0.3", features = ["formatting", "macros"] }

# Byte buffers (frame codec)
bytes = "1.12"
# Cryptographically random inner UDP session/datagram identifiers
getrandom = "0.4.3"

# Logging / metrics
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = ["http-listener"] }

# QUIC transport (rustls provider matches the rustls above: aws-lc-rs)
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs", "log"] }
quinn-proto = { version = "0.11.17", default-features = false, features = ["rustls-aws-lc-rs", "log"] }

# TLS (rustls-only, openssl forbidden)
rustls = "0.23"
rustls-pemfile = "2.2.0"
tokio-rustls = "0.26.4"
rustls-native-certs = "0.8.4"

# mTLS: extract the CN from client certificates for agent identity binding
x509-parser = "0.18"

# Cert pinning: SHA256 fingerprint verification + hex encode/decode
sha2 = "0.11"
hex = "0.4"
# Audit-log rotation: gzip-compressing sealed segments (flate2 is already
# in the dependency tree via the QUIC/TLS ecosystem; miniz_oxide backend,
# pure Rust, no new system dependencies)
flate2 = "1"

# Security: per-IP token-bucket rate limiting
governor = "0.10.4"
# Security: HTTP/1.x request-head syntax for the shared edge peek parser
# (Host routing / XFF / ACME HTTP-01)
httparse = "1.10"
# Security: PROXY protocol v1/v2 preamble parsing (edge public + hub agent
# planes behind nginx; v1 accepted from trusted proxies only — stock nginx
# stream emits v1, untrusted signatures of either version stay rejected)
ppp = "2.3"
# Security: trusted-proxy CIDR matching for the PROXY protocol trust matrix
ipnetwork = "0.21.1"
# TaskTracker (session task supervision) requires the rt feature
tokio-util = { workspace = true, features = ["rt"] }

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["async_tokio"] }
# Property-based tests for the hand-written wire codecs (tests/frame_proptest.rs):
# arbitrary bytes, mutations, truncations, splices — the decoder must never
# panic and must preserve its buffer-consumption contract.
proptest = "1.7"
# Self-signed certificates for the TLS min-version handshake test (the single
# rcgen implementation; core keeps issuance out of its production graph)
interflow-certs = { path = "../certs", version = "0.5" }
# Paused clock (start_paused) for unit tests to deterministically verify the INCOMING_SEND_TIMEOUT path
tokio = { workspace = true, features = ["test-util"] }
# Audit rotation/persistence unit tests: isolated segment directories
tempfile = "3"

# ============================================================================
# Benchmarks (criterion)
# ============================================================================
[[bench]]
name = "frame_codec"
harness = false
path = "benches/frame_codec.rs"
