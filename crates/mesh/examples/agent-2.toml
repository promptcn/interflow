# Agent-2 configuration (v3)

config_version = 3

[agent]
id = "agent-2"
hub_url = "https://127.0.0.1:6666"
auth_token = "${INTERFLOW_AGENT_TOKEN:-dev-only-agent-token}"

[tls]
enabled = true
ca_path = "certs/ca.crt"

[control]
enabled = true
listen_addr = "127.0.0.1:9001"
auth_token = "${INTERFLOW_AGENT2_CONTROL_TOKEN:-dev-only-control-token}"

[logging]
level = "info,interflow=debug"
format = "plain"

[security]
allowed_targets = ["192.168.1.158:3000"]

# QUIC transport (optional): an alternative to h2
# [agent]
# transport = "quic"
# hub_quic_addr = "127.0.0.1:6666"

