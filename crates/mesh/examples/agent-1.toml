# Agent-1 configuration (v3)

config_version = 3

[agent]
id = "agent-1"
hub_url = "https://127.0.0.1:6666"
# Reads an env var; falls back to the dev default (local development only)
auth_token = "${INTERFLOW_AGENT_TOKEN:-dev-only-agent-token}"

[tls]
enabled = true
ca_path = "certs/ca.crt"

# Transport-layer tuning — the SAME schema the hub exposes
# ([transport.h2] / [transport.quic]); both ends of a link share the same
# defaults. QUIC negotiates the idle timeout as the endpoints' minimum, so
# raise both sides together (one side alone has no effect).
# [transport.h2]
# keepalive_interval_secs = 5
# keepalive_timeout_secs = 10
#
# [transport.quic]
# max_idle_timeout_ms = 30000
# keepalive_interval_ms = 10000

[control]
enabled = true
listen_addr = "127.0.0.1:9000"
# Local token for the control API; required when enabled = true
auth_token = "${INTERFLOW_AGENT1_CONTROL_TOKEN:-dev-only-control-token}"

[logging]
level = "info,interflow=debug"
format = "plain"

[[ingress]]
name = "to-agent-2"
listen_addr = "127.0.0.1:3001"
target_agent = "agent-2"
remote_addr = "192.168.1.158:3000"

[[ingress]]
name = "to-agent-2-dns"
listen_addr = "127.0.0.1:3002"
listen_protocol = "udp"
target_agent = "agent-2"
remote_addr = "192.168.1.158:53"
# UDP tuning (optional): idle reclamation / anti-amplification rate limits
# (0 = disables the corresponding item)
idle_timeout_secs = 60
udp_per_ip_pps = 50
udp_per_ip_bytes_per_sec = 10240
udp_egress_bytes_per_sec = 262144
