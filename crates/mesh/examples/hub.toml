# Hub server configuration (v2)

config_version = 2

[server]
listen_addr = "0.0.0.0:6666"

[auth]
mode = "static-token"
allow_anonymous = false
rate_limit_per_minute = 30

  [auth.static_token]
  # In production, generate a strong random token with `openssl rand -hex 32`,
  # write it to a file, and reference it via @file::
  #   agent = "@file:/etc/interflow/agent.token"
  # Or read an env var (recommended, keeps the token out of the repo):
  #   agent = "${INTERFLOW_HUB_AGENT_TOKEN}"
  # Here we use the ${VAR:-fallback} form: reads the env var when set,
  # otherwise the fallback (only suitable for local development).
  agent = "${INTERFLOW_HUB_AGENT_TOKEN:-dev-only-agent-token}"
  admin = "${INTERFLOW_HUB_ADMIN_TOKEN:-dev-only-admin-token}"

[tls]
enabled = true
cert_path = "certs/hub.crt"
key_path = "certs/hub.key"
min_version = "1.3"

[[acl.rules]]
source = "agent-1"
target = "agent-2"

# Resource protection and self-healing (defaults shown; override as needed)
[security]
# Maximum seconds to wait when writing a Data frame into an agent's channel;
# a timeout marks the agent unreachable and evicts it, and the request returns
# 503 (guards against the black-hole 502 where requests hang forever because
# the agent is dead and the channel is full).
channel_send_timeout_secs = 30
# Grace period in seconds that an agent entry survives after its poll
# connection drops; evicted if no new /poll arrives within the window (a
# healthy agent's poll reconnect backoff tops out at 5s, so the grace period
# easily tolerates transient disconnects).
poll_grace_secs = 30

# hub→agent application-layer heartbeat: the hub sends Pings periodically (via
# the poll channel) and the agent answers POST /pong. Covers agent
# application-layer wedges that transport-level keepalive cannot detect;
# legacy agents that have never answered a Pong are excluded from
# heartbeat-based eviction (upgrading the hub does not disrupt them).
[heartbeat]
enabled = true
interval_secs = 15
max_missed = 4                         # evicted after interval*(max_missed+1) seconds of silence

[logging]
level = "info,interflow=debug"
format = "plain"

# QUIC transport (optional): coexists with the TCP h2 dual stack above; agents
# may pick either transport
# [quic]
# enabled = true            # requires [tls] to provide certificates (QUIC mandates TLS)
# listen_addr = "0.0.0.0:6667"   # defaults to the same port as server.listen_addr (TCP/UDP are independent)
# datagram_enabled = true   # UDP session DATAGRAM fast path (on by default)
