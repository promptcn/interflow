[package]
name = "interflow-mesh"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Site-to-site TCP tunnel: any TCP traffic between two private networks via a public hub"
license.workspace = true

[lib]
name = "interflow_mesh"
path = "src/lib.rs"

[[bin]]
name = "interflow-mesh"
path = "src/main.rs"

[features]
# Soak-gate fault injection in the real binaries (see interflow-core's
# src/fault.rs); off by default — production builds compile every call
# point to a no-op.
fault-injection = ["interflow-core/fault-injection"]

[dependencies]
interflow-core.workspace = true
interflow-contract.workspace = true
# Shared endpoint/authority parsing (QUIC SNI, SSRF host extraction)
interflow-util.workspace = true
# Shared rcgen issuance + name validation (single implementation behind the
# identity issuer and the test kit; mesh config validation checks names)
interflow-certs.workspace = true
# Credential Pack bootstrap + renewal (product site-to-site path)
interflow-identity.workspace = true
interflow-renewal.workspace = true
# Compile-time build identity (`version` output + engine logs)
interflow-buildinfo.workspace = true

# Async runtime
tokio = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }
socket2 = "0.6"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs", "log"] }

# HTTP/2 server and client
hyper = { version = "1.10", features = ["full", "http2"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
http = "1.4"
http-body-util = "0.1.3"

# TLS support (rustls-only) — some mesh code uses rustls types directly
rustls = "0.23"
tokio-rustls = "0.26.4"

# Config model serialization (pack bootstrap + testkit JSON handoff)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.150"

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

# Metrics
metrics = "0.24.6"

# Security
sha2 = "0.11"
ipnetwork = { version = "0.21.1", features = ["serde"] }
subtle = "2.6"

# Error handling
thiserror = "2"
# policy signature transport (hex) for the publication endpoint
hex = { workspace = true }

# Utility libraries
bytes = "1.12"
futures = "0.3"
uuid = { version = "1.23", features = ["v4", "serde"] }
# Full-jitter backoff between reconnect attempts (rand 0.9, aligned with testkit)
rand = "0.9"

# Command-line arguments
clap = { version = "4.6", features = ["derive"] }

[dev-dependencies]
# Shared test/bench harness (dev-dependency cycle: testkit depends on mesh,
# supported by cargo, same pattern as tokio/tokio-test; testkit stays out of the
# production dependency graph)
interflow-testkit = { workspace = true, features = ["fault-injection"] }
# Credential-lifecycle e2e: sub-hour leaves (the renewal threshold crossed in
# real time) and the in-process registrar they renew against. Test builds
# only — the features never reach production graphs.
interflow-identity = { workspace = true, features = ["short-leaf-ttl"] }
interflow-registrar = { workspace = true }
# rotate-transition e2e drives the REAL rotate path (plan::rotate). Dev-only
# cycle: cli depends on mesh for its own binaries, never the reverse in
# production graphs.
interflow-cli = { workspace = true }
# paused-clock unit tests (egress send-path health)
tokio = { workspace = true, features = ["test-util"] }
# bench: RST-close client sockets (avoids TIME_WAIT, prevents ephemeral port exhaustion
# when creating streams at high frequency)
libc = "0.2"
# e2e test logging (output goes to the test writer when RUST_LOG=interflow=debug)
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# fresh per-test sandbox/certificate directories (pack unit tests, e2e)
tempfile = "3"
# unit tests: config-schema fixtures are written in TOML (one serialization of
# the serde schema; the engine handoff is JSON)
toml = "1"
criterion = { version = "0.8", default-features = false, features = ["async_tokio"] }
# unit tests: fake TunnelTransport backends for the out-of-tree silence probe
async-trait = "0.1"
# e2e assertions on metrics counters (in-process recorder installed for direct snapshot reads)
metrics = "0.24.6"
# loss_hol bench artifact metadata: RFC 3339 timestamps (no chrono in the bench)
time = { version = "0.3", features = ["formatting"] }
# renewal-supervisor e2e: /health wait on the in-process registrar
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls-no-provider"] }

# ============================================================================
# Benchmarks
# ============================================================================
[[bench]]
name = "e2e_throughput"
harness = false
path = "benches/e2e_throughput.rs"

[[bench]]
name = "e2e_throughput_multi"
harness = false
path = "benches/e2e_throughput_multi.rs"

[[bench]]
name = "ping_pong_latency"
harness = false
path = "benches/ping_pong_latency.rs"

[[bench]]
name = "udp_throughput"
harness = false
path = "benches/udp_throughput.rs"

# Loss comparison (QUIC vs h2 concurrent streams): scenario benchmark with a clap CLI (not criterion)
[[bench]]
name = "loss_hol"
harness = false
path = "benches/loss_hol.rs"

[lints]
workspace = true
