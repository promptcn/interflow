[package]
name = "interflow-testkit"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Shared test/bench harness for interflow: stack assembly, certificates, impairment injection, metrics (dev-only, not in the production dependency graph)"
license = "MIT"

[lib]
name = "interflow_testkit"
path = "src/lib.rs"

# Entry point of the soak long-run guardrail (backlog §1.7): `cargo run --release -p interflow-testkit --bin soak`
[[bin]]
name = "soak"
path = "src/bin/soak.rs"

[dependencies]
interflow-core = { path = "../core", version = "0.1" }
interflow-mesh = { path = "../mesh", version = "0.1" }

# Async runtime
tokio = { version = "1.52", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }

# Certificate generation (self-signed CA / server / client)
rcgen = "0.14"

# Seeded randomness for impairment injection (reproducible)
rand = { version = "0.9", features = ["std_rng"] }

# Result serialization (bench artifact)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# soak: TOML config generation for real subprocesses (same version as mesh, reused within the lockfile)
toml = "1"
# soak: artifact timestamps (RFC3339)
chrono = "0.4"
# soak CLI
clap = { version = "4.6", features = ["derive"] }

[lints]
workspace = true
