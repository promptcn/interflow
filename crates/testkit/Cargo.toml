[package]
name = "interflow-testkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Shared test/bench harness for interflow: stack assembly, certificates, impairment injection, metrics (dev-only, not in the production dependency graph)"
license.workspace = true

[lib]
name = "interflow_testkit"
path = "src/lib.rs"

[features]
# Exposes fault::install (test plans over interflow-core's injection points;
# see core's src/fault.rs). Enabled by the mesh/expose dev-dependencies so
# every test build has it; never reaches production graphs.
fault-injection = ["interflow-core/fault-injection"]

# Entry point of the soak long-run guardrail (backlog §1.7): `cargo run --release -p interflow-testkit --bin soak`
[[bin]]
name = "soak"
path = "src/bin/soak.rs"

# The soak gate's process-under-test entry (receives the engine config as a
# JSON handoff; dev-only — the product CLI is pack-only)
[[bin]]
name = "interflow-soak-node"
path = "src/bin/soak_node.rs"

[dependencies]
interflow-core = { path = "../core", version = "0.4" }
interflow-mesh = { path = "../mesh", version = "0.4" }

# Async runtime
tokio = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }

# Certificate issuance — the single rcgen implementation shared with
# internal issuance and the test kit
interflow-certs = { path = "../certs", version = "0.4" }

# Metrics-snapshot assertion harness (same versions as mesh)
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing = "0.1"

# Seeded randomness for impairment injection (reproducible)
rand = { version = "0.9", features = ["std_rng"] }

# Result serialization (bench artifact)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# soak: artifact timestamps (RFC3339)
chrono = "0.4"
# soak CLI
clap = { version = "4.6", features = ["derive"] }

# TLS client connections for protocol-level tests (the hub is mTLS-only)
tokio-rustls = "0.26.4"
rustls = "0.23"
rustls-pemfile = "2.2.0"

# Soak error typing (dev-binary surface)
thiserror = "2"

[dev-dependencies]
# paused-clock unit tests (impair delay line)
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
