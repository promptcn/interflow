[package]
name = "interflow-testkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Shared test/bench harness for interflow: stack assembly, certificates, impairment injection, metrics (dev-only, not in the production dependency graph)"
license.workspace = true

[lib]
name = "interflow_testkit"
path = "src/lib.rs"

[features]
# Exposes fault::install (test plans over interflow-core's injection points;
# see core's src/fault.rs). Enabled by the mesh/expose dev-dependencies so
# every test build has it; never reaches production graphs.
fault-injection = ["interflow-core/fault-injection"]

# Entry point of the soak long-run guardrail (backlog §1.7): `cargo run --release -p interflow-testkit --bin soak`
[[bin]]
name = "soak"
path = "src/bin/soak.rs"

# The soak gate's process-under-test entry (receives the engine config as a
# JSON handoff; dev-only — the product CLI is pack-only)
[[bin]]
name = "interflow-soak-node"
path = "src/bin/soak_node.rs"

[dependencies]
interflow-core.workspace = true
interflow-expose.workspace = true
interflow-identity.workspace = true
interflow-mesh.workspace = true
# The fake clock implements renewal's Clock seam (scheduler tests)
interflow-renewal.workspace = true
# In-process registrar fixture (serve_on handoff, asserted readiness)
interflow-registrar.workspace = true
# Shared build identity for the `--version` flag (soak / soak-node CLIs)
interflow-buildinfo.workspace = true
# Fixture tempdirs (issuer store, TLS material)
tempfile = { workspace = true }

# Direct-dial HTTP client constructor for tests (ambient-proxy immunity)
reqwest = { workspace = true }

# Async runtime
tokio = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }

# Fake-clock wall readings (OffsetDateTime)
time = { workspace = true, features = ["formatting", "parsing"] }

# Certificate issuance — the single rcgen implementation shared with
# internal issuance and the test kit
interflow-certs.workspace = true

# Metrics-snapshot assertion harness (same versions as mesh)
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing = { workspace = true }

# Seeded randomness for impairment injection (reproducible)
rand = { version = "0.9", features = ["std_rng"] }

# Result serialization (bench artifact)
serde = { version = "1.0", features = ["derive"] }
serde_json = { workspace = true }

# soak: artifact timestamps (RFC3339)
chrono = "0.4"
# soak CLI
clap = { workspace = true }
# soak: post-run gzip of the run directory's logs (already in the tree
# transitively — no new external code)
flate2 = "1"

# TLS client connections for protocol-level tests (the hub is mTLS-only)
tokio-rustls = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }

# h2 client plumbing for protocol-level tests (the shared GET /agents
# e2e client + contract mirror in `hub_http`; same role as tokio-rustls
# above)
hyper = { workspace = true, features = ["client", "http2"] }
http-body-util = "0.1.3"

# Soak error typing (dev-binary surface)
thiserror = { workspace = true }

# Signal-0 pid-liveness probe for the stale cert-directory sweep (unix-only;
# libc is already everywhere in the tree — declaring it directly adds no new
# external code)
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# paused-clock unit tests (impair delay line)
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
