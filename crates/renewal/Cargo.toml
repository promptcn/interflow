[package]
name = "interflow-renewal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Unattended credential renewal: 50%-TTL rotation against the registrar, CRL freshness, and the node-local renewal scheduler"
license.workspace = true

[lib]
name = "interflow_renewal"
path = "src/lib.rs"

[dependencies]
interflow-identity.workspace = true
interflow-core.workspace = true
# Shared atomic writes (CRL refresh)
interflow-util.workspace = true
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
time = { workspace = true, features = ["formatting", "parsing"] }
# Scheduler banners are tracing events (not eprintln): embedders that host
# several nodes in one process (the GUI) capture and attribute them by the
# `node` field.
tracing = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
# Real-registrar fixture (serve + IssuerStore) for scheduler-direct tests
interflow-registrar = { workspace = true, features = ["fault-injection"] }
# FakeClock (the Clock seam's test implementation)
interflow-testkit.workspace = true
# Real pack rendering for the fixture (plan::apply); cargo permits the
# dev-dependency cycle cli → renewal (same pattern as mesh ↔ testkit)
interflow-cli.workspace = true
interflow-identity.workspace = true
tempfile = { workspace = true }
humantime = "2.3"
reqwest = { workspace = true }
rustls = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
