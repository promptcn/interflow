[package]
name = "interflow-identity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Identity-first model: Realm/Workspace/Ingress/Agent/Service/Route, Credential Packs, Trust Bundles, and signed runtime policy"
license.workspace = true

[lib]
name = "interflow_identity"
path = "src/lib.rs"

[features]
# Test builds only: lowers the registrar-tier leaf TTL floor
# (MIN_LEAF_TTL_SECONDS 1h → 30s) so credential-lifecycle e2e can cross the
# 50% renewal threshold in real time. Enabled exclusively through
# dev-dependencies (mesh/cli test graphs); a production dependency must
# never turn it on — the 1h floor is the shipped policy.
short-leaf-ttl = []

[dependencies]
interflow-contract.workspace = true
# Shared endpoint/authority parsing (SAN extraction, manifest endpoint
# validation); deliberately NOT interflow-core — identity stays light
interflow-util.workspace = true
# Render-provenance stamp (`PackMetadata.rendered_by`): compile-time build
# identity, zero runtime dependencies.
interflow-buildinfo.workspace = true

# X.509 issuance with URI SAN support (SPIFFE-like principal paths).
rcgen = { version = "0.14", features = ["x509-parser"] }
x509-parser = "0.18"
rustls-pemfile = "2.2.0"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }

# Serialization.
serde = { workspace = true }
toml = { workspace = true }
serde_json = "1"
humantime = "2.3"

# Errors, hashing.
thiserror = { workspace = true }
hex = { workspace = true }

# Rejection logging on the fail-keep policy-update path (state/policy).
tracing = "0.1"

# Policy signing (realm issuer policy key, independent of X.509 CAs).
ed25519-dalek = { version = "2", features = ["rand_core"] }
getrandom = "0.3"

# Range egress authorization (`mesh_egress.target_cidr`) — the same crate
# the engine matches with (`is_target_allowed`), so manifest validation and
# runtime matching can never drift apart.
ipnetwork = "0.21.1"

# Sealed Credential Packs (.iflowpack = age-encrypted tar).
age = "0.11"
tar = "0.4"

# The issuer store's bookkeeping db (binding + applied state + applied
# history; the manifest-sqlite-pivot form B). Rows map by hand — rusqlite's
# own serde feature stays out.
rusqlite = { workspace = true }

[dev-dependencies]
tokio-rustls = "0.26.4"
tempfile = "3"
