[package]
name = "interflow-identity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Identity-first model: Realm/Workspace/Ingress/Agent/Service/Route, Credential Packs, Trust Bundles, and signed runtime policy"
license.workspace = true

[lib]
name = "interflow_identity"
path = "src/lib.rs"

[dependencies]
interflow-contract = { path = "../contract", version = "0.4" }
# Shared endpoint/authority parsing (SAN extraction, manifest endpoint
# validation); deliberately NOT interflow-core — identity stays light
interflow-util = { path = "../util", version = "0.4" }

# X.509 issuance with URI SAN support (SPIFFE-like principal paths).
rcgen = { version = "0.14", features = ["x509-parser"] }
x509-parser = "0.18"
rustls-pemfile = "2.2.0"
time = { version = "0.3", features = ["formatting", "parsing"] }

# Serialization.
serde = { workspace = true }
toml = { workspace = true }
serde_json = "1"
humantime = "2.3"

# Errors, hashing.
thiserror = { workspace = true }
hex = { workspace = true }

# Policy signing (realm issuer policy key, independent of X.509 CAs).
ed25519-dalek = { version = "2", features = ["rand_core"] }
getrandom = "0.3"

# Sealed Credential Packs (.iflowpack = age-encrypted tar).
age = "0.11"
tar = "0.4"

[dev-dependencies]
tokio-rustls = "0.26.4"
tempfile = "3"
