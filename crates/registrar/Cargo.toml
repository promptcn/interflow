[package]
name = "interflow-registrar"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The independent identity registrar: enrollment-code issuance of short-lived credentials from an issuer store held outside the control plane"
license.workspace = true

[lib]
name = "interflow_registrar"
path = "src/lib.rs"

[[bin]]
name = "interflow-registrar"
path = "src/main.rs"

[dependencies]
interflow-identity = { path = "../identity", version = "0.5" }
# Shared endpoint/authority parsing for control-endpoint SAN extraction
interflow-util = { path = "../util", version = "0.5" }
serde = { workspace = true }
serde_json = "1"
clap = { version = "4.6", features = ["derive"] }
hex = { workspace = true }
getrandom = "0.3"
time = { version = "0.3", features = ["formatting", "parsing"] }
humantime = "2.3"
tokio = { workspace = true }
tokio-rustls = { version = "0.26.4", features = ["aws-lc-rs"] }
hyper = { version = "1.10", features = ["http1", "server"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
tracing = "0.1"
fs2 = "0.4"
rustls-pemfile = "2.2"
x509-parser = "0.18"

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls-no-provider"] }

[lints]
workspace = true
